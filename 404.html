<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FFFFFF" />
<meta name="robots" content="noindex" />
<script src="assets/theme.js"></script>
<title>Page not found — PDFsort</title>
<style>
  :root{ color-scheme:light; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center;
    background:#F2F2F7; color:#1C1C1E; -webkit-font-smoothing:antialiased;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Inter", system-ui, sans-serif;
  }
  .card{ background:#fff; border-radius:28px; padding:44px 28px; max-width:420px; width:100%; box-shadow:0 1px 2px rgba(0,0,0,.04), 0 10px 34px rgba(0,0,0,.08); }
  .logo{ display:block; margin:0 auto 22px; height:38px; width:auto; }
  .code{ font-size:64px; font-weight:800; letter-spacing:-.05em; color:#007AFF; line-height:1; }
  h1{ margin:14px 0 8px; font-size:24px; font-weight:800; letter-spacing:-.03em; }
  p{ margin:0 0 22px; color:#6E6E73; }
  .links{ display:flex; flex-direction:column; gap:10px; }
  a{ display:block; padding:13px 18px; border-radius:999px; text-decoration:none; font-weight:600; background:rgba(0,122,255,.1); color:#007AFF; }
  a.primary{ background:#007AFF; color:#fff; box-shadow:0 8px 22px rgba(0,122,255,.3); }
  a:focus-visible{ outline:3px solid rgba(0,122,255,.45); outline-offset:2px; }
  :root[data-theme="dark"]{ color-scheme:dark; }
  :root[data-theme="dark"] body{ background:#000; color:#F5F5F7; }
  :root[data-theme="dark"] .card{ background:#1C1C1E; box-shadow:0 0 0 .5px rgba(84,84,88,.6), 0 10px 34px rgba(0,0,0,.6); }
  :root[data-theme="dark"] p{ color:#9A9AA2; }
  :root[data-theme="dark"] .code{ color:#0A84FF; }
  :root[data-theme="dark"] a{ background:rgba(10,132,255,.2); color:#5AB1FF; }
  :root[data-theme="dark"] a.primary{ background:#0A84FF; color:#fff; box-shadow:0 8px 22px rgba(10,132,255,.35); }
  .logo.dark{ display:none; } :root[data-theme="dark"] .logo.light{ display:none; } :root[data-theme="dark"] .logo.dark{ display:block; }
</style>
</head>
<body>
  <main class="card">
    <img class="logo light" id="logo" alt="PDFsort" width="140" height="38" />
    <img class="logo dark" id="logoDark" alt="" width="140" height="38" />
    <div class="code">404</div>
    <h1>We couldn't find that page</h1>
    <p>The link may be old or mistyped. These will get you back on track.</p>
    <div class="links">
      <a class="primary" href="./">Go to the home page</a>
      <a href="app.html">Document organizer</a>
      <a href="pdf-editor.html">PDF editor</a>
      <a href="word-editor.html">Word editor</a>
    </div>
  </main>
<script>
  // A 404 can be served from any path, so work out the site's base ("/" or "/repo-name/" on GitHub Pages).
  (function(){
    var base = /\.github\.io$/i.test(location.hostname) ? '/' + (location.pathname.split('/')[1] || '') + '/' : '/';
    document.querySelectorAll('a[href]').forEach(function(a){ a.setAttribute('href', base + (a.getAttribute('href') === './' ? '' : a.getAttribute('href'))); });
    document.getElementById('logo').src = base + 'assets/logo/pdfsort-logo-small.png';
    document.getElementById('logoDark').src = base + 'assets/logo/pdfsort-logo-dark-small.png';
    var l = document.createElement('link'); l.rel = 'icon'; l.type = 'image/svg+xml'; l.href = base + 'assets/icons/favicon.svg'; document.head.appendChild(l);
  })();
</script>
</body>
</html>
